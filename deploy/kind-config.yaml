# kind cluster for the KubeSentra laboratory.
# 1 control plane + 2 workers, sized for a ~16 GB dev laptop.
# Host port mappings expose NodePorts so host processes (API, MCP servers)
# can reach Prometheus / Alertmanager / Grafana / Loki on stable URLs:
#   http://127.0.0.1:9090   Prometheus
#   http://127.0.0.1:9093   Alertmanager
#   http://127.0.0.1:3000   Grafana
#   http://127.0.0.1:13100  Loki   (3100 is taken by another local project)
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: incident-lab
nodes:
  - role: control-plane
    extraPortMappings:
      - containerPort: 30900    # Prometheus NodePort
        hostPort: 9090
        protocol: TCP
      - containerPort: 30903    # Alertmanager NodePort
        hostPort: 9093
        protocol: TCP
      - containerPort: 30300    # Grafana NodePort
        hostPort: 3000
        protocol: TCP
      - containerPort: 32100    # Loki NodePort (must be within 30000-32767)
        hostPort: 13100
        protocol: TCP
  - role: worker
  - role: worker
