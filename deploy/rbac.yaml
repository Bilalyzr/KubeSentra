# RBAC for KubeSentra MCP servers (implementation document section 5.3).
#
# Phase 3: the k8s-read server runs with its own ServiceAccount limited to
# get/list/watch - it cannot modify the cluster in any way.
# Phase 7 adds the executor role (k8s-write server) in this same file.

apiVersion: v1
kind: Namespace
metadata:
  name: kubesentra-system
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentra-reader
  namespace: kubesentra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: kubesentra-reader
rules:
  - apiGroups: ["", "apps", "metrics.k8s.io", "batch"]
    resources:
      - pods
      - pods/log
      - events
      - services
      - endpoints
      - configmaps
      - namespaces
      - nodes
      - deployments
      - replicasets
      - deploymentrevisions
      - pods/metrics
    verbs: ["get", "list", "watch"]
  # NOTE: Secrets are deliberately NOT readable by the agent.
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kubesentra-reader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: kubesentra-reader
subjects:
  - kind: ServiceAccount
    name: kubesentra-reader
    namespace: kubesentra-system
---
# Long-lived token for the generated kubeconfig (lab convenience; the token
# is stored outside the repo in .secrets/, which is git-ignored).
apiVersion: v1
kind: Secret
metadata:
  name: kubesentra-reader-token
  namespace: kubesentra-system
  annotations:
    kubernetes.io/service-account.name: kubesentra-reader
type: kubernetes.io/service-account-token
---
# ---------------------------------------------------------------------------
# Phase 6/7: the EXECUTOR identity. Narrow Role (not ClusterRole) bound to
# the application namespace ONLY - RBAC-level blast-radius enforcement.
# rollout_undo is implemented as a deployment-template patch; scale uses the
# deployments/scale subresource; set_resources patches the deployment.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kubesentra-executor
  namespace: kubesentra-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: kubesentra-executor
  namespace: boutique
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale"]
    verbs: ["get", "list", "patch", "update"]
  # rollout_undo needs ReplicaSet revision history to compute the rollback
  # template (read-only; still scoped to this namespace only)
  - apiGroups: ["apps"]
    resources: ["replicasets"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "delete"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: kubesentra-executor
  namespace: boutique
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: kubesentra-executor
subjects:
  - kind: ServiceAccount
    name: kubesentra-executor
    namespace: kubesentra-system
---
apiVersion: v1
kind: Secret
metadata:
  name: kubesentra-executor-token
  namespace: kubesentra-system
  annotations:
    kubernetes.io/service-account.name: kubesentra-executor
type: kubernetes.io/service-account-token
