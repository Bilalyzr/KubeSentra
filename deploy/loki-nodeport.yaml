# NodePort service exposing Loki on 33100 (host: http://127.0.0.1:13100 via
# the kind extraPortMappings entry). Used by the Loki MCP server (Phase 3).
# NOTE: selector verified against the live loki chart labels after install.
apiVersion: v1
kind: Service
metadata:
  name: loki-nodeport
  namespace: monitoring
spec:
  type: NodePort
  selector:
    app.kubernetes.io/name: loki
    app.kubernetes.io/component: single-binary
  ports:
    - name: http
      port: 3100
      targetPort: 3100
      nodePort: 32100
