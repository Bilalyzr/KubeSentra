# Grafana Alloy values for the KubeSentra lab: discover pods via the
# Kubernetes API and stream their logs to Loki (single binary) using
# loki.source.kubernetes (API-based tailing - no node-local file access
# needed, so a single deployment replica works).
# Additional read-only RBAC (pods, pods/log) is in deploy/alloy-rbac.yaml.

controller:
  type: deployment
  replicas: 1

alloy:
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      memory: 384Mi
  configMap:
    content: |
      // --- discover pods ------------------------------------------------
      discovery.kubernetes "pods" {
        role = "pod"
      }

      discovery.relabel "pods" {
        targets = discovery.kubernetes.pods.targets

        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          target_label  = "namespace"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          target_label  = "pod"
        }
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          target_label  = "container"
        }
      }

      // --- stream logs through the Kubernetes API ------------------------
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pods.output
        forward_to = [loki.write.loki.receiver]
      }

      loki.write "loki" {
        endpoint {
          url = "http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push"
        }
      }
